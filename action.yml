name: Vericore AI Verification
description: Run Vericore repository verification and intelligence commands in GitHub Actions
author: Shivansh Soni

inputs:
  command:
    description: Vericore command to run (analyze, verify, pr-intelligence, or architecture-contract)
    required: false
    default: analyze
  path:
    description: Repository path to inspect
    required: false
    default: .
  version:
    description: Vericore release tag to install, for example v0.8.2. Use latest for the newest published release.
    required: false
    default: latest
  args:
    description: Additional arguments passed to the selected Vericore command
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install Vericore
      shell: bash
      env:
        VERICORE_VERSION: ${{ inputs.version }}
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        case "${RUNNER_OS}/${RUNNER_ARCH}" in
          Linux/X64) asset="linux-x64"; archive_ext="tar.gz" ;;
          macOS/X64) asset="macos-x64"; archive_ext="tar.gz" ;;
          macOS/ARM64) asset="macos-arm64"; archive_ext="tar.gz" ;;
          *) echo "::error::Unsupported runner ${RUNNER_OS}/${RUNNER_ARCH}."; exit 1 ;;
        esac
        if [[ "$VERICORE_VERSION" == "latest" ]]; then
          release_json="$(curl --fail --location --retry 3 --retry-delay 1 --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/sonii-shivansh/Vericore/releases/latest")
          tag="$(printf '%s' "$release_json" | jq -r '.tag_name')"
          [[ -n "$tag" ]] || { echo "::error::Unable to resolve the latest Vericore release tag."; exit 1; }
        else
          tag="$VERICORE_VERSION"
        fi
        tag="${tag#v}"
        base_url="https://github.com/sonii-shivansh/Vericore/releases/download/v${tag}"
        archive="vericore-${tag}-${asset}.${archive_ext}"
        tmp_dir="$(mktemp -d)"
        trap 'rm -rf "$tmp_dir"' EXIT
        curl --fail --location --retry 3 --retry-delay 1 --silent --show-error -o "$tmp_dir/$archive" "$base_url/$archive"
        curl --fail --location --retry 3 --retry-delay 1 --silent --show-error -o "$tmp_dir/SHA256SUMS" "$base_url/SHA256SUMS"
        expected="$(awk -v file="$archive" '$2 == file {print $1; exit}' "$tmp_dir/SHA256SUMS")"
        [[ -n "$expected" ]] || { echo "::error::No SHA-256 entry found for $archive."; exit 1; }
        if command -v sha256sum >/dev/null 2>&1; then
          actual="$(sha256sum "$tmp_dir/$archive" | awk '{print $1}')"
        else
          actual="$(shasum -a 256 "$tmp_dir/$archive" | awk '{print $1}')"
        fi
        [[ "$actual" == "$expected" ]] || { echo "::error::SHA-256 verification failed for $archive."; exit 1; }
        install_root="$RUNNER_TEMP/vericore"
        rm -rf "$install_root"
        mkdir -p "$install_root"
        tar -xzf "$tmp_dir/$archive" -C "$install_root"
        echo "$install_root/vericore/bin" >> "$GITHUB_PATH"
        "$install_root/vericore/bin/vericore" --version

    - name: Run Vericore
      shell: bash
      env:
        VERICORE_COMMAND: ${{ inputs.command }}
        VERICORE_PATH: ${{ inputs.path }}
        VERICORE_ARGS: ${{ inputs.args }}
      run: |
        set -euo pipefail
        case "$VERICORE_COMMAND" in
          analyze|verify|pr-intelligence|architecture-contract) ;;
          *) echo "::error::Unsupported Vericore command '$VERICORE_COMMAND'."; exit 1 ;;
        esac
        read -r -a extra_args <<< "$VERICORE_ARGS"
        case "$VERICORE_COMMAND" in
          verify)
            vericore verify --path "$VERICORE_PATH" "${extra_args[@]}"
            ;;
          analyze|pr-intelligence|architecture-contract)
            vericore "$VERICORE_COMMAND" "$VERICORE_PATH" "${extra_args[@]}"
            ;;
        esac
