name: Vericore AI Verification
description: Run Vericore repository verification and intelligence commands in GitHub Actions
author: Shivansh Soni

inputs:
  command:
    description: Vericore command to run (analyze, verify, pr-intelligence, or architecture-contract)
    required: false
    default: analyze
  path:
    description: Repository path to inspect
    required: false
    default: .
  version:
    description: Vericore release tag to install, for example v0.9.0. Use latest for the newest published release.
    required: false
    default: latest
  args:
    description: Additional arguments passed to the selected Vericore command
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install Vericore
      shell: bash
      env:
        VERICORE_VERSION: ${{ inputs.version }}
        GITHUB_TOKEN: ${{ github.token }}
      run: bash "${GITHUB_ACTION_PATH}/scripts/action-install.sh"

    - name: Run Vericore
      shell: bash
      env:
        VERICORE_COMMAND: ${{ inputs.command }}
        VERICORE_PATH: ${{ inputs.path }}
        VERICORE_ARGS: ${{ inputs.args }}
      run: |
        set -euo pipefail
        case "$VERICORE_COMMAND" in
          analyze|verify|pr-intelligence|architecture-contract) ;;
          *) echo "::error::Unsupported Vericore command '$VERICORE_COMMAND'."; exit 1 ;;
        esac
        read -r -a extra_args <<< "$VERICORE_ARGS"
        case "$VERICORE_COMMAND" in
          verify)
            report_path="${RUNNER_TEMP:-${TMPDIR:-/tmp}}/vericore-verification-${GITHUB_RUN_ID:-local}.json"
            has_output=false
            expect_output_value=false
            for arg in "${extra_args[@]}"; do
              if [[ "$expect_output_value" == true ]]; then
                report_path="$arg"
                expect_output_value=false
                continue
              fi
              case "$arg" in
                --output)
                  has_output=true
                  expect_output_value=true
                  ;;
                --output=*)
                  report_path="${arg#--output=}"
                  has_output=true
                  ;;
              esac
            done
            if [[ "$has_output" != true ]]; then
              extra_args+=(--output "$report_path")
            fi
            set +e
            vericore verify --path "$VERICORE_PATH" "${extra_args[@]}"
            verify_status=$?
            set -e
            if command -v python3 >/dev/null 2>&1; then
              python3 "$GITHUB_ACTION_PATH/scripts/action_verification_summary.py" "$report_path" "$VERICORE_PATH" ||
                echo "::warning::Could not write Vericore verification step summary."
            else
              echo "::warning::Python 3 is unavailable; Vericore verification ran without a step summary."
            fi
            exit "$verify_status"
            ;;
          analyze|pr-intelligence|architecture-contract)
            vericore "$VERICORE_COMMAND" "$VERICORE_PATH" "${extra_args[@]}"
            ;;
        esac
