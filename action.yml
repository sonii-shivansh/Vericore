name: Vericore AI Verification
description: Run Vericore repository verification and intelligence commands in GitHub Actions
author: Shivansh Soni

inputs:
  command:
    description: Vericore command to run (analyze, prepare, verify, pr-intelligence, or architecture-contract)
    required: false
    default: analyze
  path:
    description: Repository path to inspect
    required: false
    default: .
  change-summary:
    description: Required when command is prepare; short description of the change being prepared
    required: false
    default: ""
  agent-provider:
    description: Optional agent provider slug for prepare, e.g. cursor, claude-code, codex
    required: false
    default: ""
  agent-id:
    description: Optional opaque agent identity; never include secrets
    required: false
    default: ""
  agent-session-id:
    description: Optional opaque session correlation ID
    required: false
    default: ""
  agent-event-id:
    description: Optional opaque event correlation ID
    required: false
    default: ""
  version:
    description: Vericore release tag to install, for example v1.0.0. Use latest for the newest published release.
    required: false
    default: latest
  args:
    description: Additional arguments passed to the selected Vericore command
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install Vericore
      shell: bash
      env:
        VERICORE_VERSION: ${{ inputs.version }}
        GITHUB_TOKEN: ${{ github.token }}
      run: bash "${GITHUB_ACTION_PATH}/scripts/action-install.sh"

    - name: Run Vericore
      shell: bash
      env:
        VERICORE_COMMAND: ${{ inputs.command }}
        VERICORE_PATH: ${{ inputs.path }}
        VERICORE_ARGS: ${{ inputs.args }}
        VERICORE_CHANGE_SUMMARY: ${{ inputs.change-summary }}
        VERICORE_AGENT_PROVIDER: ${{ inputs.agent-provider }}
        VERICORE_AGENT_ID: ${{ inputs.agent-id }}
        VERICORE_AGENT_SESSION_ID: ${{ inputs.agent-session-id }}
        VERICORE_AGENT_EVENT_ID: ${{ inputs.agent-event-id }}
      run: bash "${GITHUB_ACTION_PATH}/scripts/action-run.sh"
