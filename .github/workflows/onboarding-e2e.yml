name: Onboarding E2E

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  onboarding:
    name: Zero-setup CLI E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "gradle"

      - name: Build distribution
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon clean test installDist

      - name: Verify help exposes onboarding commands
        shell: bash
        run: |
          CLI=./build/install/vericore/bin/vericore
          "$CLI" --help > help.txt
          grep -q "setup" help.txt
          grep -q "doctor" help.txt
          "$CLI" setup --help
          "$CLI" doctor --help

      - name: Verify first-run diagnostics outside a Git repository
        shell: bash
        run: |
          CLI=./build/install/vericore/bin/vericore
          FIRST_RUN_DIR="$RUNNER_TEMP/vericore-first-run"
          rm -rf "$FIRST_RUN_DIR"
          mkdir -p "$FIRST_RUN_DIR"
          cd "$FIRST_RUN_DIR"
          "$GITHUB_WORKSPACE/build/install/vericore/bin/vericore" doctor | tee first-run-doctor.txt
          grep -q "Vericore doctor" first-run-doctor.txt
          grep -q "Java runtime" first-run-doctor.txt
          grep -q "Repository" first-run-doctor.txt
          grep -q "not a Git repository" first-run-doctor.txt
          grep -q "AI credentials" first-run-doctor.txt

      - name: Verify clean checkout diagnostics
        shell: bash
        run: |
          CLI=./build/install/vericore/bin/vericore
          "$CLI" doctor | tee doctor.txt
          grep -q "Vericore doctor" doctor.txt
          grep -q "Java runtime" doctor.txt
          grep -q "Repository" doctor.txt
          grep -q "AI credentials" doctor.txt

      - name: Create a real Git fixture repository
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/vericore-fixture"
          mkdir -p "$RUNNER_TEMP/vericore-fixture/src/main/java/example"
          cd "$RUNNER_TEMP/vericore-fixture"
          git init -q
          git config user.name "Vericore E2E"
          git config user.email "e2e@example.com"
          cat > pom.xml <<'XML'
          <project xmlns="http://maven.apache.org/POM/4.0.0">
            <modelVersion>4.0.0</modelVersion>
            <groupId>example</groupId>
            <artifactId>vericore-e2e-fixture</artifactId>
            <version>1.0.0</version>
          </project>
          XML
          cat > mvnw <<'SH'
          #!/bin/sh
          printf '%s\n' "$*" >> verification-executed.log
          exit 0
          SH
          chmod +x mvnw
          cat > src/main/java/example/Service.java <<'JAVA'
          package example;
          public class Service {
              public String greet(String name) { return "Hello " + name; }
          }
          JAVA
          cat > README.md <<'MD'
          # Vericore E2E Fixture
          MD
          git add .
          git commit -qm "initial fixture"
          # Verify prepare/verify against an actual pending working-tree change.
          cat > src/main/java/example/Service.java <<'JAVA'
          package example;
          public class Service {
              public String greet(String name) { return "Hello, " + name; }
          }
          JAVA
          CLI="$GITHUB_WORKSPACE/build/install/vericore/bin/vericore"
          "$CLI" analyze .
          test -s output/index.html
          test -s output/analysis-snapshot.json
          "$CLI" architecture . --json
          test -s output/architecture.json
          "$CLI" repo-qa "what are the main files?" --path . > output/repo-qa.json
          test -s output/repo-qa.json
          "$CLI" prepare "refactor the greeting service safely"
          test -s output/engineering-preparation.json
          test -s output/engineering-plan.json
          "$CLI" verify --output output/verify.json
          test -s output/verify.json

      - name: Verify no project secret file is required
        shell: bash
        run: |
          cd "$RUNNER_TEMP/vericore-fixture"
          test ! -f .vericore.json
          test ! -f .vericore.json.template

      - name: Verify environment-based credential discovery without persisting it
        shell: bash
        env:
          VERICORE_GEMINI_API_KEY: ${{ secrets.VERICORE_GEMINI_API_KEY || secrets.GEMINI_API_KEY || secrets.VERICORE_GOOGLE_API_KEY || secrets.GOOGLE_API_KEY }}
        run: |
          cd "$RUNNER_TEMP/vericore-fixture"
          CLI="$GITHUB_WORKSPACE/build/install/vericore/bin/vericore"
          test -n "$VERICORE_GEMINI_API_KEY"
          "$CLI" doctor | tee env-doctor.txt
          grep -Fq "VERICORE_GEMINI_API_KEY environment variable" env-doctor.txt
          grep -Fq "Gemini API — reachable and credentials accepted" env-doctor.txt
          grep -Fq "✓ Vericore is ready to use." env-doctor.txt
          test ! -f .vericore.json
