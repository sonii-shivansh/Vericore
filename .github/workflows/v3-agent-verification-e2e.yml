name: V3 Agent Verification E2E

on:
  pull_request:
    paths:
      - 'src/main/**'
      - 'src/test/**'
      - 'scripts/audit/agent-verification-e2e.sh'
      - 'docs/MCP.md'
      - 'docs/CHANGE_SAFETY.md'
      - 'docs/IMPLEMENTATION_STATUS.md'
      - '.github/workflows/v3-agent-verification-e2e.yml'
  push:
    branches: [main]
    paths:
      - 'src/main/**'
      - 'src/test/**'
      - 'scripts/audit/agent-verification-e2e.sh'
      - 'docs/MCP.md'
      - 'docs/CHANGE_SAFETY.md'
      - 'docs/IMPLEMENTATION_STATUS.md'
      - '.github/workflows/v3-agent-verification-e2e.yml'

permissions:
  contents: read

jobs:
  agent-verification:
    name: Agent prepare-change-verify
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: temurin
          cache: gradle
      - name: Build CLI
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon clean test installDist
      - name: Run V3-001 agent verification E2E
        env:
          APP: \${{ github.workspace }}/build/install/vericore/bin/vericore
        run: bash scripts/audit/agent-verification-e2e.sh
