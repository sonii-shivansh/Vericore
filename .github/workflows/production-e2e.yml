name: Production E2E Verification

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/production-e2e.yml"
      - ".github/workflows/live-output-quality.yml"
      - "scripts/audit/production-e2e.sh"
      - "src/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-e2e:
    name: Authoritative production E2E
    uses: ./.github/workflows/live-output-quality.yml
    with:
      repository: spring-projects/spring-petclinic
      ref: main
      run_gemini: false
    secrets: inherit
