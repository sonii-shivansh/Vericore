name: Documentation Parity

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  cli-documentation-parity:
    name: CLI documentation parity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build CLI
        run: ./gradlew installDist --no-daemon

      - name: Audit CLI documentation parity
        run: bash scripts/audit/docs-parity.sh
