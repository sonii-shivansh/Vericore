name: Documentation Parity

on:
  workflow_call: {}
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  cli-documentation-parity:
    name: CLI documentation parity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42ed6d17772635956322a3cf5fcf309b634b # v7.0.1

      - name: Set up JDK 25
        uses: actions/setup-java@77dd5b2ce2a8fb3a5661d9a2ff1b0bb7a7f4bbef # v6.2.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Build CLI
        run: ./gradlew installDist --no-daemon

      - name: Audit CLI documentation parity
        run: bash scripts/audit/docs-parity.sh
