name: Documentation Parity

on:
  workflow_call: {}
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  cli-documentation-parity:
    name: CLI documentation parity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 25
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Build CLI
        run: ./gradlew installDist --no-daemon

      - name: Audit CLI documentation parity
        run: bash scripts/audit/docs-parity.sh
