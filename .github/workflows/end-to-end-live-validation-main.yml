name: End-to-End Live Repository Validation

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/end-to-end-live-validation-main.yml"
      - ".github/workflows/end-to-end-live-validation-reusable.yml"
      - "scripts/audit/production-e2e.sh"
      - "src/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/end-to-end-live-validation-main.yml"
      - ".github/workflows/end-to-end-live-validation-reusable.yml"
      - "scripts/audit/production-e2e.sh"
      - "src/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"

permissions:
  contents: read

jobs:
  live-e2e:
    name: Live end-to-end application validation
    uses: ./.github/workflows/end-to-end-live-validation-reusable.yml
    with:
      repository: spring-projects/spring-petclinic
      ref: main
      run_ai: false
    secrets: inherit
