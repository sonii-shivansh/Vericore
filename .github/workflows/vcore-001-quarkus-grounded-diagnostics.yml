name: VCORE-001 Quarkus Grounded Diagnostics

on:
  push:
    branches:
      - fix/vcore-001-same-package-dependencies
  workflow_dispatch:
    inputs:
      repository:
        description: GitHub repository to test
        required: false
        default: quarkusio/quarkus
      ref:
        description: Repository ref
        required: false
        default: main

permissions:
  contents: read

env:
  JAVA_VERSION: '21'

jobs:
  diagnose:
    name: Diagnose grounded pipeline
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TARGET_REPOSITORY: ${{ inputs.repository || 'quarkusio/quarkus' }}
      TARGET_REF: ${{ inputs.ref || 'main' }}
    steps:
      - name: Checkout Vericore
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: temurin
          cache: gradle
      - name: Build and test Vericore
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon clean test installDist
      - name: Clone target repository
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/target"
          git clone --depth 50 --branch "$TARGET_REF" "https://github.com/$TARGET_REPOSITORY.git" "$RUNNER_TEMP/target"
      - name: Analyze target once
        working-directory: ${{ runner.temp }}/target
        run: |
          set -euo pipefail
          CLI="$GITHUB_WORKSPACE/build/install/vericore/bin/vericore"
          /usr/bin/time -v "$CLI" analyze .
          test -s output/analysis-snapshot.json
      - name: Time repo-qa independently
        working-directory: ${{ runner.temp }}/target
        run: |
          set -euo pipefail
          CLI="$GITHUB_WORKSPACE/build/install/vericore/bin/vericore"
          rm -f output/grounded-evidence.json output/repo-qa.json
          /usr/bin/time -v timeout --signal=TERM --kill-after=30s 8m \
            "$CLI" repo-qa "Which files are the main architectural hotspots?" --path . --evidence-output output/grounded-evidence.json \
            > output/repo-qa.json
          test -s output/repo-qa.json
          test -s output/grounded-evidence.json
      - name: Time plan independently
        working-directory: ${{ runner.temp }}/target
        run: |
          set -euo pipefail
          CLI="$GITHUB_WORKSPACE/build/install/vericore/bin/vericore"
          /usr/bin/time -v timeout --signal=TERM --kill-after=30s 5m \
            "$CLI" plan "Improve the repository safely" --evidence output/grounded-evidence.json --output output/engineering-plan.json
          test -s output/engineering-plan.json
      - name: Time prepare independently
        working-directory: ${{ runner.temp }}/target
        run: |
          set -euo pipefail
          CLI="$GITHUB_WORKSPACE/build/install/vericore/bin/vericore"
          /usr/bin/time -v timeout --signal=TERM --kill-after=30s 8m \
            "$CLI" prepare "Improve the repository safely"
          test -s output/engineering-plan.json
          test -s output/engineering-context.json
          test -s output/agent-change-contract.json
      - name: Report repository state
        if: always()
        working-directory: ${{ runner.temp }}/target
        run: |
          echo '--- Git status ---'
          git status --short
          echo '--- Generated artifacts ---'
          find output -maxdepth 1 -type f -printf '%f %s bytes\n' | sort | head -100
