name: Platform Smoke

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    paths:
      - "scripts/prepare-runtime.sh"
      - "scripts/prepare-runtime.ps1"
      - "scripts/test-runtime-packaging.sh"
      - ".github/workflows/platform.yml"

permissions:
  contents: read

jobs:
  smoke:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-24.04
          - name: Windows x64
            os: windows-2025
          - name: macOS x64
            os: macos-15-intel
          - name: macOS arm64
            os: macos-15
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 25
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: "25"
          distribution: "temurin"
          cache: "gradle"

      - name: Unix installer path-safety regression
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bash -n scripts/install.sh
          bash scripts/test-installers.sh

      - name: Verify runtime packaging script contract
        shell: bash
        run: bash scripts/test-runtime-packaging.sh

      - name: Resolve application version
        id: version
        shell: bash
        run: |
          version="$(./gradlew -q properties | awk -F': ' '$1 == "version" {print $2; exit}')"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build distribution on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon installDist

      - name: Build bundled Java runtime on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: ./scripts/prepare-runtime.sh build/install/vericore

      - name: Verify CLI on Unix using bundled Java only
        if: runner.os != 'Windows'
        shell: bash
        run: |
          JAVA_HOME='/does-not-exist' ./build/install/vericore/bin/vericore --version | grep -F '${{ steps.version.outputs.version }}'
          JAVA_HOME='/does-not-exist' ./build/install/vericore/bin/vericore --help >/dev/null
          test -x ./build/install/vericore/jre/bin/java

      - name: Verify Unix release archive
        if: runner.os != 'Windows'
        shell: bash
        run: |
          archive="vericore-${{ steps.version.outputs.version }}-${{ matrix.name }}.tar.gz"
          tar -czf "$archive" -C build/install vericore
          tar -tzf "$archive" | grep -F 'vericore/bin/vericore'

      - name: Build distribution on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\gradlew.bat --no-daemon installDist

      - name: Verify generated Windows launcher classpath
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $script = Get-Content -Raw .\build\install\vericore\bin\vericore.bat
          $classpathLine = $script -split '\r?\n' | Where-Object { $_ -eq 'set CLASSPATH=%APP_HOME%\lib\*' }
          if (-not $classpathLine) {
            Write-Host 'Generated launcher:'
            Write-Host $script
            throw 'Windows launcher does not use the compact lib wildcard classpath.'
          }

      - name: Build bundled Java runtime on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\prepare-runtime.ps1 -DistDir .\build\install\vericore

      - name: Verify CLI on Windows using bundled Java only
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:JAVA_HOME = 'C:\does-not-exist'
          $version = (& .\build\install\vericore\bin\vericore.bat --version).Trim()
          if ($version -notmatch [regex]::Escape('${{ steps.version.outputs.version }}')) { throw "Unexpected version: $version" }
          & .\build\install\vericore\bin\vericore.bat --help | Out-Null
          if (-not (Test-Path .\build\install\vericore\jre\bin\java.exe)) { throw 'Bundled Java runtime was not created.' }

      - name: Verify Windows release archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = "vericore-${{ steps.version.outputs.version }}-Windows-x64.zip"
          Compress-Archive -Path .\build\install\vericore -DestinationPath $archive
          if (-not (Test-Path $archive)) { throw "Archive was not created" }
