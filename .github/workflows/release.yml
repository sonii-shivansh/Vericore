name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without v prefix, for example 0.8.0"
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-audit:
    name: Certify release candidate
    uses: ./.github/workflows/release-audit.yml
    secrets: inherit

  resolve-version:
    name: Resolve and verify release version
    needs: release-audit
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "gradle"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ inputs.version }}"
          fi
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify Gradle version matches release version
        shell: bash
        run: |
          declared="$(./gradlew -q properties | awk -F': ' '$1 == "version" {print $2; exit}')"
          test "$declared" = "${{ steps.version.outputs.version }}"

      - name: Verify application version contract
        shell: bash
        run: |
          declared="$(./gradlew -q properties | awk -F': ' '$1 == "version" {print $2; exit}')"
          application_version="$(grep -o 'const val current: String = "[^"]*"' src/main/kotlin/com/vericore/core/Version.kt | sed -E 's/.*"([^"]+)"/\1/')"
          test "$declared" = "$application_version"
          test "$application_version" = "${{ steps.version.outputs.version }}"

      - name: Run release test suite
        run: ./gradlew --no-daemon clean test

      - name: Verify runtime packaging script contract
        run: ./scripts/test-runtime-packaging.sh

  package:
    name: Package ${{ matrix.name }}
    needs: resolve-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            runner: ubuntu-24.04
          - name: windows-x64
            runner: windows-2025
          - name: macos-x64
            runner: macos-15-intel
          - name: macos-arm64
            runner: macos-14
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "gradle"

      - name: Build distribution on Unix
        if: runner.os != 'Windows'
        run: |
          chmod +x ./gradlew ./scripts/prepare-runtime.sh
          ./gradlew --no-daemon installDist
          ./scripts/prepare-runtime.sh build/install/vericore

      - name: Verify bundled CLI on Unix without relying on system Java
        if: runner.os != 'Windows'
        shell: bash
        run: |
          JAVA_HOME='/does-not-exist' ./build/install/vericore/bin/vericore --version | grep -F '${{ needs.resolve-version.outputs.version }}'
          test -x ./build/install/vericore/jre/bin/java

      - name: Build distribution on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\gradlew.bat --no-daemon installDist
          .\scripts\prepare-runtime.ps1 -DistDir .\build\install\vericore

      - name: Verify bundled CLI on Windows without relying on system Java
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:JAVA_HOME = 'C:\does-not-exist'
          $version = (& .\build\install\vericore\bin\vericore.bat --version).Trim()
          if ($version -notmatch [regex]::Escape('${{ needs.resolve-version.outputs.version }}')) { throw "Unexpected version: $version" }
          if (-not (Test-Path .\build\install\vericore\jre\bin\java.exe)) { throw 'Bundled Java runtime was not packaged.' }

      - name: Package Unix artifact
        if: runner.os != 'Windows'
        shell: bash
        run: |
          VERSION='${{ needs.resolve-version.outputs.version }}'
          tar -czf "vericore-${VERSION}-${{ matrix.name }}.tar.gz" -C build/install vericore

      - name: Package Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = '${{ needs.resolve-version.outputs.version }}'
          Compress-Archive -Path .\build\install\vericore -DestinationPath "vericore-$version-${{ matrix.name }}.zip"

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: vericore-${{ matrix.name }}
          path: vericore-*-${{ matrix.name }}.*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [release-audit, resolve-version, package]
    runs-on: ubuntu-24.04
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: vericore-*
          path: release-assets
          merge-multiple: true

      - name: Generate checksums
        working-directory: release-assets
        run: |
          sha256sum vericore-* > SHA256SUMS
          cat SHA256SUMS

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.resolve-version.outputs.version }}
          name: Vericore v${{ needs.resolve-version.outputs.version }}
          generate_release_notes: true
          files: |
            release-assets/vericore-*
            release-assets/SHA256SUMS
