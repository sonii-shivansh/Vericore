name: Verification

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    name: Build, test, and end-to-end verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "gradle"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Verify Java and Gradle versions
        run: |
          java -version
          ./gradlew --version

      - name: Run unit and property tests
        run: ./gradlew --no-daemon clean test

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vericore-test-diagnostics
          if-no-files-found: ignore
          path: |
            build/test-results/
            build/reports/tests/
            build/reports/ktlint/

      - name: Build application and distribution
        run: ./gradlew --no-daemon build installDist

      - name: Resolve declared application version
        id: version
        shell: bash
        run: |
          version="$(./gradlew -q properties | awk -F': ' '$1 == "version" {print $2; exit}')"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Verify CLI
        shell: bash
        run: |
          ./build/install/vericore/bin/vericore --help
          version="$(./build/install/vericore/bin/vericore --version)"
          echo "$version"
          echo "$version" | grep -F '${{ steps.version.outputs.version }}'

      - name: Verify self-analysis workspace
        shell: bash
        run: |
          pwd
          test -d src
          count="$(find src -type f \( -name '*.kt' -o -name '*.java' \) | wc -l)"
          echo "Source files visible to CI: $count"
          test "$count" -gt 0
          if [ -f .vericore.json ]; then
            echo "Unexpected project config created during build/test:"
            cat .vericore.json
            exit 1
          fi

      - name: Run self-analysis end-to-end
        run: |
          rm -rf output
          ./build/install/vericore/bin/vericore analyze .
          test -s output/index.html
          test -s output/analysis-snapshot.json
          test -s output/engineering-risks.json

      - name: Validate generated intelligence artifacts
        shell: bash
        run: |
          grep -q "Vericore Analysis Report" output/index.html
          grep -q "Knowledge Hotspots" output/index.html
          grep -q "Personalized Learning Path" output/index.html
          python3 - <<'PY'
          import json
          from pathlib import Path
          snapshot = json.loads(Path("output/analysis-snapshot.json").read_text())
          risks = json.loads(Path("output/engineering-risks.json").read_text())
          assert snapshot["schemaVersion"] == "1.1"
          assert snapshot["metrics"]["totalFiles"] > 0
          assert snapshot["metrics"]["totalNodes"] >= snapshot["metrics"]["totalFiles"]
          assert isinstance(snapshot["hotspots"], list)
          assert isinstance(risks, list)
          assert all(0 <= item["score"] <= 100 for item in risks)
          assert "repositoryCommit" in snapshot["repository"]
          assert "repositoryStateDigest" in snapshot["repository"]
          assert snapshot["repository"]["repositoryStateDigest"]
          PY

      - name: Verify Engineering Reality state binding
        shell: bash
        run: |
          CLI=./build/install/vericore/bin/vericore
          "$CLI" reality . --json
          test -s output/engineering-reality.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          reality = json.loads(Path("output/engineering-reality.json").read_text())
          assert reality["schemaVersion"] == "1.0"
          assert reality["analysisSchemaVersion"] == "1.1"
          assert reality["repositoryCommit"]
          assert reality["analysisDigest"]
          assert reality["contextDigest"]
          assert reality["realityDigest"]
          PY
          probe="src/VericoreRealityStaleStateProbe.java"
          printf '%s\n' 'class VericoreRealityStaleStateProbe {}' > "$probe"
          if "$CLI" reality . --json > /tmp/reality-stale.txt 2>&1; then
            cat /tmp/reality-stale.txt
            rm -f "$probe"
            echo "Expected stale analysis rejection, but reality generation succeeded."
            exit 1
          fi
          grep -F "source-state digest" /tmp/reality-stale.txt
          rm -f "$probe"
          "$CLI" reality . --json
          test -s output/engineering-reality.json

      - name: Generate grounded repository evidence
        run: |
          rm -f output/grounded-evidence.json
          ./build/install/vericore/bin/vericore repo-qa "which files are the main architectural hotspots?" --path . --evidence-output output/grounded-evidence.json > output/repo-qa.json
          test -s output/repo-qa.json
          test -s output/grounded-evidence.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path("output/repo-qa.json").read_text())
          evidence = json.loads(Path("output/grounded-evidence.json").read_text())
          assert "question" in result
          assert "evidence" in result
          assert isinstance(result["evidence"], list)
          assert evidence["schemaVersion"] == "1.0"
          assert isinstance(evidence["citations"], list)
          assert evidence["citations"]
          PY

      - name: Generate evidence-backed engineering plan
        run: |
          rm -f output/engineering-plan.json
          ./build/install/vericore/bin/vericore plan "improve the repository safely" --evidence output/grounded-evidence.json --output output/engineering-plan.json
          test -s output/engineering-plan.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          plan = json.loads(Path("output/engineering-plan.json").read_text())
          assert plan["schemaVersion"] == "1.0"
          assert plan["steps"]
          assert plan["evidenceIds"]
          PY

      - name: Verify PR Intelligence CLI
        run: |
          rm -f output/pr-intelligence.json
          ./build/install/vericore/bin/vericore pr-intelligence . --base HEAD~1 --head HEAD --json
          test -s output/pr-intelligence.json

      - name: Verify Architecture Intelligence CLI
        run: |
          rm -f output/architecture.json
          ./build/install/vericore/bin/vericore architecture . --json
          test -s output/architecture.json

      - name: Verify Architecture Drift CLI
        shell: bash
        run: |
          cp output/architecture.json output/architecture-baseline.json
          rm -f output/architecture-drift.json
          ./build/install/vericore/bin/vericore architecture-drift . --baseline output/architecture-baseline.json --json
          test -s output/architecture-drift.json

      - name: Verify Architecture Contract CLI
        shell: bash
        run: |
          rm -f output/architecture-contract.json
          cat > .vericore-architecture-contract.json <<'JSON'
          {
            "schemaVersion": "1.0",
            "maxFindings": 100000,
            "maxCycles": 100000,
            "allowedSeverities": ["LOW", "MEDIUM", "HIGH", "CRITICAL"],
            "requiredRules": []
          }
          JSON
          ./build/install/vericore/bin/vericore architecture-contract . --json
          test -s output/architecture-contract.json
          rm -f .vericore-architecture-contract.json

      - name: Verify Engineering Context CLI
        shell: bash
        run: |
          rm -f output/engineering-context.json output/engineering-context-diff.json
          ./build/install/vericore/bin/vericore context-snapshot . --json
          test -s output/engineering-context.json
          cp output/engineering-context.json output/engineering-context-baseline.json
          ./build/install/vericore/bin/vericore context-diff output/engineering-context-baseline.json output/engineering-context.json --json
          test -s output/engineering-context-diff.json

      - name: Start server
        shell: bash
        run: |
          ./build/install/vericore/bin/vericore server --host 127.0.0.1 --port 18080 > server.log 2>&1 &
          echo $! > server.pid

      - name: Wait for server
        shell: bash
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18080/ > response.txt; then exit 0; fi
            sleep 1
          done
          cat server.log
          exit 1

      - name: Verify API health and version contract
        run: |
          grep -F "Vericore API is running" response.txt
          health="$(curl --fail --silent http://127.0.0.1:18080/health)"
          echo "$health" | grep -F '"status":"healthy"'
          echo "$health" | grep -F '"version":"${{ steps.version.outputs.version }}"'
          curl --fail --silent http://127.0.0.1:18080/health/live | grep -F '"status":"live"'
          curl --fail --silent http://127.0.0.1:18080/health/ready | grep -F '"status":"ready"'

      - name: Verify API input security boundaries
        run: |
          status=$(curl --silent --output /tmp/traversal.json --write-out '%{http_code}' -H 'Content-Type: application/json' -d '{"repoPath":"/tmp/../etc"}' http://127.0.0.1:18080/analyze)
          test "$status" = "400"
          status=$(curl --silent --output /tmp/remote.json --write-out '%{http_code}' -H 'Content-Type: application/json' -d '{"repoPath":"https://example.com/repo"}' http://127.0.0.1:18080/analyze)
          test "$status" = "400"
          status=$(curl --silent --output /tmp/revision.json --write-out '%{http_code}' -H 'Content-Type: application/json' -d '{"repoPath":".","baseRevision":"HEAD~1"}' http://127.0.0.1:18080/pr-intelligence)
          test "$status" = "400"

      - name: Verify PR Intelligence REST API
        run: |
          curl --fail --silent -H 'Content-Type: application/json' -d '{"repoPath":".","baseRevision":"HEAD~1","headRevision":"HEAD"}' http://127.0.0.1:18080/pr-intelligence > pr-intelligence-response.json
          test -s pr-intelligence-response.json

      - name: Verify Architecture Intelligence REST API
        run: |
          curl --fail --silent -H 'Content-Type: application/json' -d '{"repoPath":"."}' http://127.0.0.1:18080/architecture > architecture-response.json
          test -s architecture-response.json

      - name: Verify generated report is self-contained
        run: |
          ! grep -q "unpkg.com" output/index.html
          ! grep -q '<script src=' output/index.html

      - name: Stop server
        if: always()
        run: |
          if [ -f server.pid ]; then kill "$(cat server.pid)" || true; fi

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vericore-verification
          if-no-files-found: ignore
          path: |
            output/
            build/test-results/
            build/reports/tests/
            server.log
            response.txt
            pr-intelligence-response.json
            architecture-response.json
