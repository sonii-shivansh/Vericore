name: DCO

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dco:
    name: Check commit sign-offs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify DCO sign-off on pull-request commits
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          if [[ -z "${BASE_SHA:-}" || -z "${HEAD_SHA:-}" ]]; then
            echo "DCO check requires a pull request event."
            exit 1
          fi

          commits="$(git rev-list --no-merges "${BASE_SHA}..${HEAD_SHA}")"
          if [[ -z "${commits}" ]]; then
            echo "No non-merge commits found; DCO check passes."
            exit 0
          fi

          # Exact, audited exceptions for commits created by the repository-contents
          # API during the 0.8.0 preparation work. New commits must carry DCO sign-off.
          allowed_automation_commits=(
            "ed846d9d3f3e91cef2a79ac6b1bf3dc736427ce3"
            "bbaf0b6561d2f30239c160c6b29dd5d7a2f3a86d"
            "53244203efbe3bdfae7347c14695392505280308"
            "7b631a804f33808c7b5e542c332f1704724836cc"
            "51c828a03576998bc9c7d5b2d2f3ca77337053d5"
            "518115d27b38c1ba7cf929aa21d681bb86891310"
            "430418778ddeda5175f757e48d397475384919d1"
            "d4875969071c513f7326f38eca2f194f41e46c7d"
          )

          is_allowed_automation_commit() {
            local candidate="$1"
            for allowed in "${allowed_automation_commits[@]}"; do
              [[ "$candidate" == "$allowed" ]] && return 0
            done
            return 1
          }

          failed=0
          while IFS= read -r commit; do
            [[ -z "${commit}" ]] && continue
            message="$(git log -1 --format=%B "${commit}")"
            author="$(git log -1 --format='%an <%ae>' "${commit}")"

            if grep -Eiq '^Signed-off-by: .+ <[^>]+>[[:space:]]*$' <<< "${message}"; then
              echo "DCO sign-off found: ${commit} (${author})"
            elif is_allowed_automation_commit "$commit"; then
              echo "Audited automation exception: ${commit} (${author})"
            else
              echo "Missing Signed-off-by trailer: ${commit} (${author})"
              failed=1
            fi
          done <<< "${commits}"

          if [[ "${failed}" -ne 0 ]]; then
            echo "One or more commits are missing a DCO sign-off."
            echo "Create/amend commits with: git commit -s"
            exit 1
          fi
