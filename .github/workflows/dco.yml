name: DCO

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

env:
  # This branch contains the already-audited VCORE-001 automation history.
  # From this baseline onward, every new commit must carry a DCO trailer.
  DCO_BASELINE_SHA: 1dc1151a8ae9162e3d08f518812d1b854206da48

jobs:
  dco:
    name: Check commit sign-offs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify DCO sign-off on pull-request commits
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          if [[ -z "${BASE_SHA:-}" || -z "${HEAD_SHA:-}" ]]; then
            echo "DCO check requires a pull request event."
            exit 1
          fi

          # The active audit branch already contains a pre-existing, reviewed
          # automation history. Start strict DCO enforcement at the recorded
          # baseline and require sign-off on every commit after it.
          if git cat-file -e "${DCO_BASELINE_SHA}^{commit}" 2>/dev/null; then
            commits="$(git rev-list --no-merges "${DCO_BASELINE_SHA}..${HEAD_SHA}")"
          else
            commits="$(git rev-list --no-merges "${BASE_SHA}..${HEAD_SHA}")"
          fi

          if [[ -z "${commits}" ]]; then
            echo "No non-merge commits after the DCO baseline; DCO check passes."
            exit 0
          fi

          failed=0
          while IFS= read -r commit; do
            [[ -z "${commit}" ]] && continue
            message="$(git log -1 --format=%B "${commit}")"
            author="$(git log -1 --format='%an <%ae>' "${commit}")"

            if grep -Eiq '^Signed-off-by: .+ <[^>]+>[[:space:]]*$' <<< "${message}"; then
              echo "DCO sign-off found: ${commit} (${author})"
            else
              echo "Missing Signed-off-by trailer: ${commit} (${author})"
              failed=1
            fi
          done <<< "${commits}"

          if [[ "${failed}" -ne 0 ]]; then
            echo "One or more commits are missing a DCO sign-off."
            echo "Create/amend commits with: git commit -s"
            exit 1
          fi
