name: Phase 4 Regression

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "build.gradle.kts"
      - "gradle/**"
      - "gradlew"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  phase4:
    name: Engineering workflow repository scope
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "gradle"

      - name: Build Vericore
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon build installDist

      - name: Test plan from outside target repository
        shell: bash
        run: |
          set -euo pipefail
          CLI="$PWD/build/install/vericore/bin/vericore"
          fixture="$(mktemp -d)"
          trap 'rm -rf "$fixture"' EXIT
          mkdir -p "$fixture/output" "$fixture/src"
          cat > "$fixture/output/grounded-evidence.json" <<'JSON'
          {
            "schemaVersion": "1.0",
            "citations": [
              {"id":"repo.metrics","type":"repository-metrics","detail":"2 analyzed files","metrics":{"files":"2"}},
              {"id":"hotspot.1","type":"hotspot","path":"src/Service.java","detail":"central hotspot","metrics":{"dependents":"3"}},
              {"id":"architecture.summary","type":"architecture-summary","detail":"cycles=false","metrics":{"cycles":"false"}}
            ]
          }
          JSON
          repo="$PWD"
          cd /tmp
          "$CLI" plan "Improve the service safely" --repository "$fixture" --changed src/Service.java --output output/plan.json
          test -s "$fixture/output/plan.json"
          test ! -e /tmp/output/plan.json
          python3 - "$fixture/output/plan.json" "$fixture" <<'PY'
          import json, pathlib, sys
          plan = json.load(open(sys.argv[1]))
          repo = str(pathlib.Path(sys.argv[2]).resolve())
          assert plan["repository"] == repo, plan
          assert plan["plannedPaths"] == ["src/Service.java"], plan
          assert all(repo in command for command in plan["verificationCommands"]), plan
          assert plan["contractFingerprint"]
          PY

      - name: Reject path traversal in planned changes
        shell: bash
        run: |
          set -euo pipefail
          CLI="$PWD/build/install/vericore/bin/vericore"
          fixture="$(mktemp -d)"
          trap 'rm -rf "$fixture"' EXIT
          mkdir -p "$fixture/output"
          printf '%s\n' '{"schemaVersion":"1.0","citations":[]}' > "$fixture/output/grounded-evidence.json"
          set +e
          "$CLI" plan "Unsafe change" --repository "$fixture" --changed ../outside.kt > /tmp/phase4-unsafe.txt 2>&1
          status=$?
          set -e
          cat /tmp/phase4-unsafe.txt
          test "$status" -ne 0
          grep -F "repository-relative" /tmp/phase4-unsafe.txt

      - name: Test evidence path cannot escape repository
        shell: bash
        run: |
          set -euo pipefail
          CLI="$PWD/build/install/vericore/bin/vericore"
          fixture="$(mktemp -d)"
          trap 'rm -rf "$fixture"' EXIT
          mkdir -p "$fixture/output"
          printf '%s\n' '{"schemaVersion":"1.0","citations":[]}' > "$fixture/output/grounded-evidence.json"
          printf '%s\n' '{"schemaVersion":"1.0","citations":[]}' > "$fixture/outside.json"
          set +e
          "$CLI" plan "Escape attempt" --repository "$fixture" --evidence ../outside.json > /tmp/phase4-evidence.txt 2>&1
          status=$?
          set -e
          cat /tmp/phase4-evidence.txt
          test "$status" -ne 0
          grep -F "Evidence path must be inside repository" /tmp/phase4-evidence.txt
