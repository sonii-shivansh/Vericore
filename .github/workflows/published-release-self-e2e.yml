name: Published Release Self-E2E

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/published-release-self-e2e.yml"
  workflow_dispatch:
    inputs:
      version:
        description: Published version to validate, without the leading v
        required: true
        type: string
        default: "1.0.1"

permissions:
  contents: read

jobs:
  published-release-self-e2e:
    name: Test published binary against its own tagged repository
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RELEASE_VERSION: ${{ inputs.version || '1.0.1' }}

    steps:
      - name: Checkout exact source tag
        uses: actions/checkout@v7
        with:
          ref: v${{ inputs.version || '1.0.1' }}
          path: target-repo
          fetch-depth: 0

      - name: Download and verify published Linux artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $RELEASE_VERSION" >&2
            exit 1
          fi

          tag="v$RELEASE_VERSION"
          asset="vericore-$RELEASE_VERSION-linux-x64.tar.gz"
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/$asset"
          archive="$RUNNER_TEMP/$asset"
          install_dir="$RUNNER_TEMP/vericore-release"

          curl --fail --location --silent --show-error --retry 5 --retry-all-errors \
            "$url" --output "$archive"

          expected_digest="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" \
            --jq ".assets[] | select(.name == \"$asset\") | .digest")"
          if [[ ! "$expected_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "No valid published SHA-256 digest found for $asset" >&2
            exit 1
          fi
          expected_digest="${expected_digest#sha256:}"
          actual_digest="$(sha256sum "$archive" | awk '{print $1}')"
          printf 'Expected SHA-256: %s\nActual SHA-256:   %s\n' "$expected_digest" "$actual_digest"
          test "$actual_digest" = "$expected_digest"

          python3 - "$archive" <<'PY'
          import pathlib, sys, tarfile

          def stays_within_archive(path_parts, base_parts=()):
              stack = list(base_parts)
              for part in path_parts:
                  if part in ("", "."):
                      continue
                  if part == "..":
                      if not stack:
                          return False
                      stack.pop()
                  else:
                      stack.append(part)
              return True

          archive = sys.argv[1]
          with tarfile.open(archive, "r:gz") as bundle:
              bad = []
              for member in bundle.getmembers():
                  path = pathlib.PurePosixPath(member.name)
                  # Archive entries themselves must not use traversal paths.
                  if path.is_absolute() or ".." in path.parts or "\\" in member.name:
                      bad.append(member.name)
                      continue
                  if member.issym() or member.islnk():
                      link_text = member.linkname
                      target = pathlib.PurePosixPath(link_text)
                      if target.is_absolute() or "\\" in link_text:
                          bad.append(f"{member.name} -> {link_text}")
                          continue
                      # POSIX symlinks are relative to the symlink's directory.
                      # Tar hard-link names are relative to the archive root.
                      base = path.parent.parts if member.issym() else ()
                      if not stays_within_archive(target.parts, base):
                          bad.append(f"{member.name} -> {link_text}")
              if bad:
                  raise SystemExit("Unsafe archive members: " + repr(bad))
          print("Archive path-safety check: PASS")
          PY

          mkdir -p "$install_dir"
          tar -xzf "$archive" -C "$install_dir"
          cli="$install_dir/vericore/bin/vericore"
          test -x "$cli"
          actual_version="$("$cli" --version)"
          printf 'Published CLI: %s\n' "$actual_version"
          test "$actual_version" = "vericore version $RELEASE_VERSION"
          echo "VERICORE_RELEASE_CLI=$cli" >> "$GITHUB_ENV"

      - name: Run full command-surface E2E against Vericore itself
        env:
          CLI: ${{ runner.temp }}/vericore-release/vericore/bin/vericore
          TARGET_REPOSITORY: sonii-shivansh/Vericore
          VERICORE_E2E_COMMAND_TIMEOUT_SECONDS: "240"
        shell: bash
        run: |
          set -euo pipefail
          test -x "$CLI"
          bash target-repo/scripts/audit/production-e2e.sh \
            "$GITHUB_WORKSPACE/target-repo" \
            "$RUNNER_TEMP/vericore-self-e2e"

      - name: Exercise remaining deterministic CLI commands and MCP tools
        shell: bash
        run: |
          set -euo pipefail
          REPO="$GITHUB_WORKSPACE/target-repo"
          CLI="$RUNNER_TEMP/vericore-release/vericore/bin/vericore"
          OUT="$RUNNER_TEMP/vericore-self-e2e-extra"
          mkdir -p "$OUT"

          run_ok() {
            local name="$1"; shift
            echo "===== $name ====="
            "$@" >"$OUT/$name.stdout" 2>"$OUT/$name.stderr"
            printf '0\n' >"$OUT/$name.exit"
          }

          run_ok 42-scan "$CLI" scan --path "$REPO" --clear-cache
          test -s "$REPO/output/index.html"
          test -s "$REPO/output/analysis-snapshot.json"

          run_ok 43-inspect "$CLI" inspect --path "$REPO" --json
          test -s "$REPO/output/inspection.json"
          python3 - "$REPO/output/inspection.json" <<'PY'
          import json, sys
          data=json.load(open(sys.argv[1]))
          assert isinstance(data, dict) and data, data
          PY

          run_ok 44-recommendations "$CLI" recommendations "$REPO" --json
          test -s "$REPO/output/recommendations.json"
          python3 - "$REPO/output/recommendations.json" <<'PY'
          import json, sys
          data=json.load(open(sys.argv[1]))
          assert isinstance(data, list), type(data)
          PY

          run_ok 45-review "$CLI" review --path "$REPO" --base HEAD~1 --head HEAD --json
          test -s "$REPO/output/review.json"
          python3 - "$REPO/output/review.json" <<'PY'
          import json, sys
          data=json.load(open(sys.argv[1]))
          assert isinstance(data, dict) and data, data
          assert "deterministic" in data or "result" in data or "changeSummary" in data, list(data)
          PY

          run_ok 46-report "$CLI" report --path "$REPO" --output "$OUT/self-report.html"
          test -s "$OUT/self-report.html"
          grep -q "Vericore Engineering Report" "$OUT/self-report.html"

          # Test the no-secret setup path only; never enter, save, or expose a credential.
          set +e
          "$CLI" setup --force --provider gemini </dev/null >"$OUT/47-setup-empty.stdout" 2>"$OUT/47-setup-empty.stderr"
          setup_rc=$?
          set -e
          printf '%s\n' "$setup_rc" >"$OUT/47-setup-empty.exit"
          test "$setup_rc" -eq 0
          grep -q "No API key supplied. Nothing was changed." "$OUT/47-setup-empty.stdout"

          # An unsupported provider must fail safely and identify the validation error.
          set +e
          "$CLI" setup --provider unsupported-provider >"$OUT/48-setup-invalid.stdout" 2>"$OUT/48-setup-invalid.stderr"
          setup_rc=$?
          set -e
          printf '%s\n' "$setup_rc" >"$OUT/48-setup-invalid.exit"
          test "$setup_rc" -ne 0
          grep -qi "Unsupported provider" "$OUT/48-setup-invalid.stdout" "$OUT/48-setup-invalid.stderr"

          # Without credentials, ask must skip AI safely without prompting interactively or saving anything.
          set +e
          env -u VERICORE_GEMINI_API_KEY -u VERICORE_GOOGLE_API_KEY -u GEMINI_API_KEY -u GOOGLE_API_KEY \
            "$CLI" ask "Summarize the architecture of this repository" </dev/null >"$OUT/49-ask-without-credentials.stdout" 2>"$OUT/49-ask-without-credentials.stderr"
          ask_rc=$?
          set -e
          printf '%s\n' "$ask_rc" >"$OUT/49-ask-without-credentials.exit"
          test "$ask_rc" -eq 0
          grep -q "No API key supplied. AI remains disabled." "$OUT/49-ask-without-credentials.stdout"

          # Exercise initialize, tools/list, ping, and actual deterministic MCP tool calls.
          python3 - "$CLI" "$REPO" "$OUT" <<'PY'
          import json, pathlib, subprocess, sys
          cli, repo, out = map(pathlib.Path, sys.argv[1:])
          requests = [
              {"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-11-25","capabilities":{},"clientInfo":{"name":"published-self-e2e","version":"1.0.0"}}},
              {"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}},
              {"jsonrpc":"2.0","id":3,"method":"ping","params":{}},
              {"jsonrpc":"2.0","id":4,"method":"tools/call","params":{"name":"vericore_get_engineering_reality","arguments":{"repoPath":str(repo)}}},
              {"jsonrpc":"2.0","id":5,"method":"tools/call","params":{"name":"vericore_get_context_snapshot","arguments":{"repoPath":str(repo)}}},
          ]
          proc=subprocess.run([str(cli),"mcp"],input="\n".join(map(json.dumps,requests))+"\n",text=True,capture_output=True)
          (out/"50-mcp-tools.stdout").write_text(proc.stdout)
          (out/"50-mcp-tools.stderr").write_text(proc.stderr)
          (out/"50-mcp-tools.exit").write_text(str(proc.returncode)+"\n")
          if proc.returncode != 0:
              raise SystemExit(f"MCP server exited {proc.returncode}: {proc.stderr}")
          responses={item.get("id"):item for item in (json.loads(line) for line in proc.stdout.splitlines() if line.strip())}
          assert responses[1].get("result",{}).get("protocolVersion"), responses.get(1)
          assert responses[3].get("result")=={}, responses.get(3)
          names={x.get("name") for x in responses[2].get("result",{}).get("tools",[])}
          required={"vericore_get_engineering_reality","vericore_get_context_snapshot"}
          assert required <= names, sorted(required-names)
          for request_id in (4,5):
              result=responses[request_id].get("result")
              assert result and result.get("isError") is False, responses.get(request_id)
              text="".join(c.get("text","") for c in result.get("content",[]))
              assert text.strip(), responses.get(request_id)
          (out/"50-mcp-tools-summary.json").write_text(json.dumps({
              "protocolVersion":responses[1]["result"]["protocolVersion"],
              "advertisedToolCount":len(names),
              "calledTools":["vericore_get_engineering_reality","vericore_get_context_snapshot"],
              "callsPassed":2
          },indent=2)+"\n")
          print("MCP tool-call E2E: PASS")
          PY

          # Exercise init in an isolated temporary Git repository. Earlier E2E
          # commands may have created config/output state in the tagged checkout;
          # init must be tested from a clean, deterministic starting point.
          INIT_REPO="$RUNNER_TEMP/vericore-init-fixture"
          mkdir -p "$INIT_REPO"
          git -C "$INIT_REPO" init --quiet
          set +e
          "$CLI" init --path "$INIT_REPO" --json >"$OUT/51-init.stdout" 2>"$OUT/51-init.stderr"
          init_rc=$?
          set -e
          printf '%s\n' "$init_rc" >"$OUT/51-init.exit"
          if [[ "$init_rc" -ne 0 ]]; then
            echo "init --json exited $init_rc" >&2
            cat "$OUT/51-init.stderr" >&2
            exit "$init_rc"
          fi
          python3 - "$OUT/51-init.stdout" "$OUT/51-init.stderr" "$INIT_REPO" <<'PY'
          import json, pathlib, sys
          stdout_path, stderr_path, repo_path = map(pathlib.Path, sys.argv[1:])
          stdout = stdout_path.read_text()
          if not stdout.strip():
              raise SystemExit(
                  "init --json returned an empty stdout stream; stderr was: "
                  + repr(stderr_path.read_text())
              )
          result = json.loads(stdout)
          repo = repo_path.resolve()
          assert result.get("status") == "PASS", result
          assert (repo / ".vericore.json").is_file(), "init did not create .vericore.json"
          assert (repo / ".vericore").is_dir(), "init did not create .vericore workspace"
          PY
          rm -rf "$INIT_REPO"

          # Run generated-output schema checks and enforce a clean source checkout.
          python3 - "$REPO" "$OUT" <<'PY'
          import json, pathlib, sys
          repo,out=map(pathlib.Path,sys.argv[1:])
          for name in ["analysis-snapshot.json","inspection.json","recommendations.json","review.json",
                       "architecture.json","architecture-contract.json","architecture-drift.json",
                       "engineering-context.json","engineering-context-diff.json","engineering-reality.json",
                       "grounded-evidence.json","engineering-plan.json"]:
              path=repo/"output"/name
              assert path.is_file() and path.stat().st_size>0, f"missing {name}"
              json.loads(path.read_text())
          report=out/"self-report.html"
          assert report.is_file() and "Vericore Engineering Report" in report.read_text()
          print("Additional CLI output audit: PASS")
          PY

      - name: Audit command exit statuses and repository integrity
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/vericore-self-e2e" <<'PY'
          from pathlib import Path
          import sys
          output = Path(sys.argv[1])
          status_files = sorted(output.glob("*.exit"))
          if not status_files:
              raise SystemExit("No command exit receipts were created")
          expected_failures = {
              "37-verify-without-mutation.exit",
              "38-verify-unexpected.exit",
          }
          seen = {p.name for p in status_files}
          missing = expected_failures - seen
          if missing:
              raise SystemExit(f"Missing expected negative-test receipts: {sorted(missing)}")
          failures = []
          for p in status_files:
              code = int(p.read_text().strip())
              if p.name in expected_failures:
                  if code == 0:
                      failures.append(f"{p.name}: expected a non-zero fail-closed result")
              elif code != 0:
                  failures.append(f"{p.name}: unexpected exit code {code}")
          if failures:
              raise SystemExit("\n".join(failures))
          print(f"Command exit audit: PASS ({len(status_files)} receipts; expected fail-closed probes verified)")
          PY

          git -C target-repo status --short
          test -z "$(git -C target-repo diff --name-only)"
          test -z "$(git -C target-repo diff --cached --name-only)"

      - name: Upload full self-E2E evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: published-release-self-e2e-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/vericore-self-e2e/
            ${{ runner.temp }}/vericore-self-e2e-extra/
            target-repo/output/*.json
            target-repo/output/agent-e2e/
          if-no-files-found: warn
