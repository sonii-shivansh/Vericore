name: Vericore PR Review Comment

on:
  workflow_run:
    workflows: ["Vericore PR Review"]
    types: [completed]

permissions:
  actions: read
  issues: write
  pull-requests: write

jobs:
  comment:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download review artifact
        uses: actions/download-artifact@v5
        with:
          name: vericore-pr-review
          path: ${{ runner.temp }}/vericore-pr-review
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update PR review comment
        uses: actions/github-script@v8
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/vericore-pr-review
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');

            const dir = process.env.ARTIFACT_DIR;
            const read = name => fs.readFileSync(path.join(dir, name), 'utf8').trim();
            const prNumber = Number(read('pr-number'));
            const headSha = read('head-sha');
            const baseSha = read('base-sha');

            if (!Number.isInteger(prNumber) || prNumber < 1) {
              throw new Error('Invalid PR number in review artifact');
            }
            if (!/^[0-9a-f]{40}$/i.test(headSha) || !/^[0-9a-f]{40}$/i.test(baseSha)) {
              throw new Error('Invalid Git SHA in review artifact');
            }

            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });

            if (pr.head.sha !== headSha) {
              core.info('Skipping stale Vericore result because the PR head has changed.');
              return;
            }

            const review = JSON.parse(
              fs.readFileSync(path.join(dir, 'pr-intelligence.json'), 'utf8')
            );
            const severity = String(review.aggregateSeverity || 'UNKNOWN');
            const summary = review.changeSummary || {};
            const findings = Array.isArray(review.findings) ? review.findings : [];

            const clean = value => String(value ?? '')
              .replace(/@/g, '@\u200b')
              .split(String.fromCharCode(96)).join("'")
              .replace(/</g, '&lt;')
              .replace(/>/g, '&gt;')
              .slice(0, 700);

            const lines = [
              '<!-- vericore-pr-review -->',
              '## 🔎 Vericore PR Review',
              '',
              '| Signal | Result |',
              '|---|---:|',
              '| Risk | **' + clean(severity) + '** |',
              '| Changed files | ' + (Number(summary.filesChanged) || 0) + ' |',
              '| Lines | +' + (Number(summary.additions) || 0) + ' / -' + (Number(summary.deletions) || 0) + ' |',
              '| Impacted files | ' + (Number(review.impactedFiles) || 0) + ' |',
              '| Cross-package impacts | ' + (Number(review.crossPackageImpacts) || 0) + ' |',
              '| Test candidates | ' + (Array.isArray(review.testCandidates) ? review.testCandidates.length : 0) + ' |',
              ''
            ];

            if (findings.length === 0) {
              lines.push('**Findings:** none from the deterministic review.');
            } else {
              lines.push('### Findings');
              for (const finding of findings.slice(0, 8)) {
                const paths = Array.isArray(finding.paths)
                  ? finding.paths.slice(0, 4).map(clean).join(', ')
                  : '';
                let line = '- **' + clean(finding.severity) + '** — ' +
                  clean(finding.ruleId) + ': ' + clean(finding.reason);
                if (paths) line += ' — ' + paths;
                lines.push(line);
              }
              if (findings.length > 8) {
                lines.push('- _' + (findings.length - 8) +
                  ' additional findings are available in the workflow artifact._');
              }
            }

            lines.push(
              '',
              'Compared **' + baseSha.slice(0, 12) + '** → **' + headSha.slice(0, 12) + '**.',
              '',
              '> Deterministic engineering signals are evidence, not proof of correctness or security.',
              '',
              '_Generated by Vericore._'
            );

            const body = lines.join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              per_page: 100
            });

            const existing = comments.find(comment =>
              comment.user?.type === 'Bot' &&
              comment.body?.includes('<!-- vericore-pr-review -->')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body
              });
            }
