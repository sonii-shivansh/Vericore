name: Vericore PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze pull request
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run Vericore PR intelligence
        uses: ./ # local action
        with:
          command: pr-intelligence
          path: .
          args: --base ${{ github.event.pull_request.base.sha }} --head ${{ github.event.pull_request.head.sha }} --json

      - name: Prepare review artifact
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          test -s output/pr-intelligence.json
          mkdir -p review-artifact
          cp output/pr-intelligence.json review-artifact/pr-intelligence.json
          printf '%s\n' "$PR_NUMBER" > review-artifact/pr-number
          printf '%s\n' "$HEAD_SHA" > review-artifact/head-sha
          printf '%s\n' "$BASE_SHA" > review-artifact/base-sha

      - name: Upload review artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vericore-pr-review
          path: review-artifact/
          retention-days: 7
