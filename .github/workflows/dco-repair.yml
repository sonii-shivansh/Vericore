name: Temporary DCO History Repair

on:
  push:
    branches: [release/0.8.0-preparation-v2]
    paths:
      - .github/workflows/dco-repair.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.actor == 'sonii-shivansh'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout complete branch history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Add DCO trailers to every preparation commit
        shell: bash
        run: |
          set -euo pipefail
          base="9adb752ef2e2ecc3614f13abf7c36688c7901e91"
          git config user.name "Shivansh Soni"
          git config user.email "s.soni.shivansh@gmail.com"
          git filter-branch --force --msg-filter '
            if grep -Eiq "^Signed-off-by: .+ <[^>]+>[[:space:]]*$"; then
              cat
            else
              cat
              printf "\\nSigned-off-by: Shivansh Soni <s.soni.shivansh@gmail.com>\\n"
            fi
          ' "${base}..HEAD"

      - name: Force-update repaired branch
        shell: bash
        run: |
          set -euo pipefail
          git push --force-with-lease origin "HEAD:${GITHUB_REF_NAME}"

      - name: Remove temporary repair workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/dco-repair.yml
          git commit -s -m "chore: remove temporary DCO repair workflow"
          git push origin "HEAD:${GITHUB_REF_NAME}"
