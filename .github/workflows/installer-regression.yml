name: Installer Regression

on:
  workflow_call: {}
  pull_request:
    paths:
      - "scripts/install.sh"
      - "scripts/install.ps1"
      - "scripts/test-installers.sh"
      - "scripts/test-installers.ps1"
      - "scripts/audit/release-readiness.py"
      - "scripts/audit/test_release_readiness.py"
      - ".github/workflows/installer-regression.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/release-audit.yml"
  push:
    branches: [main]
    paths:
      - "scripts/install.sh"
      - "scripts/install.ps1"
      - "scripts/test-installers.sh"
      - "scripts/test-installers.ps1"
      - "scripts/audit/release-readiness.py"
      - "scripts/audit/test_release_readiness.py"
      - ".github/workflows/installer-regression.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/release-audit.yml"

permissions:
  contents: read

jobs:
  unix-installer-contract:
    name: Unix installer contract and regression / ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-24.04
          - name: macOS x64
            os: macos-15-intel
          - name: macOS arm64
            os: macos-14
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Validate Bash syntax and exercise installer
        run: |
          bash -n scripts/install.sh
          bash scripts/test-installers.sh
          python3 scripts/audit/test_release_readiness.py

  windows-installer-syntax:
    name: Windows installer safety and upgrade regression
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Parse PowerShell installer
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          $path = Join-Path $env:GITHUB_WORKSPACE 'scripts/install.ps1'
          [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

      - name: Exercise Windows install, upgrade, and unsafe-path rejection
        shell: pwsh
        run: pwsh scripts/test-installers.ps1
