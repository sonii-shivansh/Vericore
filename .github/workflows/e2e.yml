name: End-to-End Test Suite

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-workflow:
    name: Full E2E & Command Suite (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python-version: ['3.12', '3.13']

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 50

      - name: Validate and exercise release helper regressions (Bash)
        if: runner.os != 'Windows' && matrix.python-version == '3.12'
        shell: bash
        run: |
          bash -n scripts/prepare-release.sh
          bash -n scripts/test-prepare-release.sh
          bash scripts/test-prepare-release.sh

      - name: Validate and exercise release helper regressions (Windows PowerShell 5.1)
        if: runner.os == 'Windows' && matrix.python-version == '3.12'
        shell: powershell
        run: |
          Write-Host "PowerShell Version: $($PSVersionTable.PSVersion)"
          Write-Host "PowerShell Edition: $($PSVersionTable.PSEdition)"

          if ($PSVersionTable.PSEdition -ne 'Desktop' -or $PSVersionTable.PSVersion.Major -ne 5 -or $PSVersionTable.PSVersion.Minor -ne 1) {
            throw "Expected Windows PowerShell 5.1 (Desktop edition), but detected $($PSVersionTable.PSEdition) edition version $($PSVersionTable.PSVersion)"
          }

          $tokens = $null
          $errors = $null
          $ast1 = [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path "scripts/prepare-release.ps1").Path, [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

          $tokens = $null
          $errors = $null
          $ast2 = [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path "scripts/test-prepare-release.ps1").Path, [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\test-prepare-release.ps1
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Set up JDK 25
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build distribution
        shell: bash
        run: |
          chmod +x ./gradlew || true
          ./gradlew --no-daemon installDist

      - name: Run complete end-to-end command & workflow test suite
        shell: bash
        run: |
          python3 scripts/test_workflows_e2e.py || python scripts/test_workflows_e2e.py

      - name: Run Vericore against Vericore (Self-Analysis)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            CLI="./build/install/vericore/bin/vericore.bat"
          else
            CLI="./build/install/vericore/bin/vericore"
            chmod +x "$CLI"
          fi
          "$CLI" --version
          "$CLI" doctor
          "$CLI" scan --path .
          "$CLI" architecture . --json
          "$CLI" context-snapshot . --json
          "$CLI" reality . --json
          "$CLI" pr-intelligence . --json
          "$CLI" evidence-graph . --json
          "$CLI" mcp-config
