name: End-to-End Test Suite

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-workflow:
    name: Full E2E & Command Suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 50

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build distribution
        shell: bash
        run: |
          chmod +x ./gradlew || true
          ./gradlew --no-daemon installDist

      - name: Run complete end-to-end command & workflow test suite
        shell: bash
        run: |
          python3 scripts/test_workflows_e2e.py || python scripts/test_workflows_e2e.py

      - name: Run Vericore against Vericore (Self-Analysis)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            CLI="./build/install/vericore/bin/vericore.bat"
          else
            CLI="./build/install/vericore/bin/vericore"
            chmod +x "$CLI"
          fi
          "$CLI" --version
          "$CLI" doctor
          "$CLI" scan --path .
          "$CLI" architecture . --json
          "$CLI" context-snapshot . --json
          "$CLI" reality . --json
          "$CLI" pr-intelligence . --json
          "$CLI" evidence-graph . --json
          "$CLI" mcp-config
