name: End-to-End Live Repository Validation (Reusable)

on:
  workflow_call:
    inputs:
      repository:
        required: false
        type: string
        default: "spring-projects/spring-petclinic"
      ref:
        required: false
        type: string
        default: "main"
      run_ai:
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      repository:
        required: false
        type: string
        default: spring-projects/spring-petclinic
      ref:
        required: false
        type: string
        default: main
      run_ai:
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  JAVA_VERSION: "21"

jobs:
  live-e2e:
    name: Live end-to-end application validation
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TARGET_REPOSITORY: ${{ inputs.repository || 'spring-projects/spring-petclinic' }}
      TARGET_REF: ${{ inputs.ref || 'main' }}
      RUN_AI: ${{ inputs.run_ai || 'false' }}
    steps:
      - name: Probe
        run: |
          echo "repository=$TARGET_REPOSITORY"
          echo "ref=$TARGET_REF"
          echo "run_ai=$RUN_AI"
