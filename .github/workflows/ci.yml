name: CI/CD

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Test on Windows
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build with Gradle
        run: ./gradlew build

      - name: Run tests
        run: ./gradlew test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-windows
          path: build/test-results/
          if-no-files-found: ignore

  build-artifacts:
    name: Build Distribution
    runs-on: windows-latest
    needs: [test]
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build distribution
        run: ./gradlew installDist

      - name: Resolve application version
        id: version
        shell: bash
        run: |
          version="$(./gradlew -q properties | awk -F': ' '$1 == "version" {print $2; exit}')"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Verify installed CLI
        shell: pwsh
        run: |
          $version = (& .\build\install\vericore\bin\vericore.bat --version).Trim()
          if ($version -notmatch [regex]::Escape('${{ steps.version.outputs.version }}')) { throw "Unexpected CLI version: $version" }

      - name: Verify Windows prepare-to-verify execution
        shell: pwsh
        run: |
          $fixture = Join-Path $env:RUNNER_TEMP "vericore-windows-e2e"
          if (Test-Path $fixture) { Remove-Item -Recurse -Force $fixture }
          New-Item -ItemType Directory -Force -Path (Join-Path $fixture "src\main\java\example") | Out-Null
          Set-Content -Path (Join-Path $fixture "pom.xml") -Value '<project />'
          Set-Content -Path (Join-Path $fixture "mvnw.cmd") -Value '@echo off`r`necho %*>>verification-executed.log`r`nexit /b 0'
          Set-Content -Path (Join-Path $fixture "src\main\java\example\Service.java") -Value 'package example; public class Service { public String greet(String name) { return "Hello " + name; } }'
          git -C $fixture init -q
          git -C $fixture config user.name "Vericore E2E"
          git -C $fixture config user.email "e2e@example.com"
          git -C $fixture add .
          git -C $fixture commit -qm "initial fixture"
          Set-Content -Path (Join-Path $fixture "src\main\java\example\Service.java") -Value 'package example; public class Service { public String greet(String name) { return "Hello, " + name; } }'
          $cli = Join-Path $env:GITHUB_WORKSPACE "build\install\vericore\bin\vericore.bat"
          & $cli analyze $fixture
          if ($LASTEXITCODE -ne 0) { throw "Windows fixture analyze failed with exit code $LASTEXITCODE" }
          & $cli prepare "verify Windows change safely" --path $fixture
          if ($LASTEXITCODE -ne 0) { throw "Windows fixture prepare failed with exit code $LASTEXITCODE" }
          $contract = Get-Content (Join-Path $fixture "output\agent-change-contract.json") -Raw
          if ($contract -notmatch "mvnw\.cmd") { throw "Prepared contract did not contain Windows Maven wrapper command" }
          if ($contract -notmatch "cd /d") { throw "Prepared contract did not contain Windows cmd directory syntax" }
          & $cli verify --path $fixture --output (Join-Path $fixture "output\verify.json")
          if ($LASTEXITCODE -ne 0) { throw "Windows fixture verify failed with exit code $LASTEXITCODE" }
          $executed = Get-Content (Join-Path $fixture "verification-executed.log") -Raw
          if ($executed -notmatch "-B test") { throw "Windows verification did not execute Maven test command" }
          if ($executed -notmatch "-B package -DskipTests") { throw "Windows verification did not execute Maven package command" }
      - name: Upload distribution
        uses: actions/upload-artifact@v7
        with:
          name: vericore-dist-windows
          path: build/install/vericore/
