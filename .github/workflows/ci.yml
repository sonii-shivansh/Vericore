name: CI/CD

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Test on Windows
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build with Gradle
        run: ./gradlew build

      - name: Run tests
        run: ./gradlew test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-windows
          path: build/test-results/
          if-no-files-found: ignore

  build-artifacts:
    name: Build Distribution
    runs-on: windows-latest
    needs: [test]
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build distribution
        run: ./gradlew installDist

      - name: Resolve application version
        id: version
        shell: bash
        run: |
          version="$(./gradlew -q properties | awk -F': ' '$1 == "version" {print $2; exit}')"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Verify installed CLI
        shell: pwsh
        run: |
          $version = (& .\build\install\vericore\bin\vericore.bat --version).Trim()
          if ($version -notmatch [regex]::Escape('${{ steps.version.outputs.version }}')) { throw "Unexpected CLI version: $version" }

      - name: Upload distribution
        uses: actions/upload-artifact@v7
        with:
          name: vericore-dist-windows
          path: build/install/vericore/
