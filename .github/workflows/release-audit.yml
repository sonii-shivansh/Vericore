name: Release Audit

on:
  workflow_dispatch:
  workflow_call:
    outputs:
      ready:
        description: "Whether the exact candidate passed every required release-audit check"
        value: ${{ jobs.readiness_certificate.outputs.ready }}
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  deterministic-audit:
    name: Deterministic audit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with: { java-version: '21', distribution: temurin, cache: gradle }
      - name: Build and test
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon clean test installDist
      - name: Resolve application version
        id: version
        shell: bash
        run: |
          version="$(./gradlew -q properties | awk -F': ' '$1 == "version" {print $2; exit}')"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Validate installer contracts
        run: |
          bash -n scripts/install.sh
          bash scripts/test-installers.sh

      - name: Run CLI audit
        run: bash scripts/audit/cli-audit.sh
      - name: Run MCP audit
        run: bash scripts/audit/mcp-audit.sh
      - name: Run REST audit
        run: bash scripts/audit/rest-audit.sh
      - name: Adversarial contract audit
        run: |
          CLI="./build/install/vericore/bin/vericore"
          rm -rf output
          "$CLI" prepare "release audit contract" --path . >/dev/null
          cp output/agent-change-contract.json /tmp/contract.json
          python3 - <<'PY'
          import json
          p='output/agent-change-contract.json'; d=json.load(open(p)); d['plannedPaths']=list(d.get('plannedPaths',[]))+['.audit-unexpected-change']; json.dump(d,open(p,'w'),indent=2)
          PY
          set +e
          "$CLI" verify --path . --plan output/engineering-plan.json --contract output/agent-change-contract.json >/tmp/tampered.log 2>&1; status=$?
          set -e
          test "$status" -ne 0
          grep -q 'Status: FAIL' /tmp/tampered.log
          cp /tmp/contract.json output/agent-change-contract.json
          printf '%s\n' 'unexpected audit mutation' > .audit-unexpected-change
          set +e
          "$CLI" verify --path . --plan output/engineering-plan.json --contract output/agent-change-contract.json >/tmp/unexpected.log 2>&1; status=$?
          set -e
          test "$status" -ne 0
          grep -q 'Status: FAIL' /tmp/unexpected.log
          rm -f .audit-unexpected-change
          test -z "$(git status --porcelain)"
      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-audit-evidence
          path: output/
          if-no-files-found: ignore

  windows-ci:
    name: Windows CI
    needs: deterministic-audit
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  verification:
    name: Product verification
    needs: deterministic-audit
    uses: ./.github/workflows/verification.yml
    secrets: inherit

  platform:
    name: Cross-platform smoke
    needs: deterministic-audit
    uses: ./.github/workflows/platform.yml
    secrets: inherit

  onboarding:
    name: Onboarding E2E
    needs: deterministic-audit
    uses: ./.github/workflows/onboarding-e2e.yml
    secrets: inherit

  live-e2e:
    name: Live end-to-end application validation (${{ matrix.target.name }})
    needs: deterministic-audit
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: Spring Petclinic
            repository: spring-projects/spring-petclinic
            ref: main
          - name: RuneLite
            repository: runelite/runelite
            ref: master
            command_timeout_seconds: 600
            job_timeout_minutes: 90
          - name: Quarkus
            repository: quarkusio/quarkus
            ref: main
            command_timeout_seconds: 600
            job_timeout_minutes: 90
          - name: Kotlin
            repository: google/kotlin
            ref: master
            command_timeout_seconds: 600
            job_timeout_minutes: 180
    uses: ./.github/workflows/end-to-end-live-validation.yml
    with:
      repository: ${{ matrix.target.repository }}
      ref: ${{ matrix.target.ref }}
      run_ai: false
      command_timeout_seconds: ${{ matrix.target.command_timeout_seconds || 180 }}
      job_timeout_minutes: ${{ matrix.target.job_timeout_minutes || 60 }}
    secrets: inherit

  live-petclinic:
    name: Live repository gate — Spring Petclinic
    needs: deterministic-audit
    uses: ./.github/workflows/live-repository-gate.yml
    with:
      repository: spring-projects/spring-petclinic
      ref: main
      run_gemini: false
    secrets: inherit

  live-runelite:
    name: Live repository gate — RuneLite
    needs: deterministic-audit
    uses: ./.github/workflows/live-repository-gate.yml
    with:
      repository: runelite/runelite
      ref: master
      run_gemini: false
    secrets: inherit

  output-petclinic:
    name: Output quality — Spring Petclinic
    needs: deterministic-audit
    uses: ./.github/workflows/live-output-quality.yml
    with:
      repository: spring-projects/spring-petclinic
      ref: main
      run_gemini: false
    secrets: inherit

  output-runelite:
    name: Output quality — RuneLite
    needs: deterministic-audit
    uses: ./.github/workflows/live-output-quality.yml
    with:
      repository: runelite/runelite
      ref: master
      run_gemini: false
      command_timeout_seconds: 600
    secrets: inherit

  readiness_certificate:
    name: Generate release readiness certificate
    if: always()
    needs: [deterministic-audit, windows-ci, verification, platform, onboarding, live-e2e, live-petclinic, live-runelite, output-petclinic, output-runelite]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      ready: ${{ steps.certificate.outputs.ready }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "gradle"
      - name: Resolve exact candidate version
        id: version
        shell: bash
        run: |
          version="$(./gradlew -q properties | awk -F': ' '$1 == "version" {print $2; exit}')"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Generate certificate
        id: certificate
        shell: bash
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CANDIDATE_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          output="release-readiness-${{ steps.version.outputs.version }}.json"
          python3 scripts/audit/release-readiness.py \
            --output "$output" \
            --version "${{ steps.version.outputs.version }}" \
            --sha "$CANDIDATE_SHA" \
            --ref "$CANDIDATE_REF" \
            --check "deterministic-audit=${{ needs.deterministic-audit.result }}" \
            --check "windows-ci=${{ needs.windows-ci.result }}" \
            --check "verification=${{ needs.verification.result }}" \
            --check "platform=${{ needs.platform.result }}" \
            --check "onboarding=${{ needs.onboarding.result }}" \
            --check "live-e2e-matrix=${{ needs.live-e2e.result }}" \
            --check "live-petclinic=${{ needs.live-petclinic.result }}" \
            --check "live-runelite=${{ needs.live-runelite.result }}" \
            --check "output-petclinic=${{ needs.output-petclinic.result }}" \
            --check "output-runelite=${{ needs.output-runelite.result }}"
          ready="$(python3 -c 'import json; print(str(json.load(open("'"$output"'"))["overallReady"]).lower())')"
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
      - name: Validate certificate schema and candidate binding
        shell: bash
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          files = sorted(Path('.').glob('release-readiness-*.json'))
          assert len(files) == 1, files
          certificate = json.loads(files[0].read_text())
          assert certificate['schemaVersion'] == '1.0'
          assert certificate['project'] == 'Vericore'
          assert certificate['candidate']['sha'] == os.environ['CANDIDATE_SHA']
          assert certificate['checks']
          assert certificate['overallReady'] is all(item['passed'] for item in certificate['checks'].values())
          assert all(item['required'] is True for item in certificate['checks'].values())
          PY
      - name: Upload readiness certificate
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-readiness-${{ steps.version.outputs.version }}
          path: release-readiness-*.json
          if-no-files-found: error
      - name: Fail closed when candidate is not release-ready
        if: always()
        shell: bash
        run: |
          ready='${{ steps.certificate.outputs.ready }}'
          test "$ready" = "true"
