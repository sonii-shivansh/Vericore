name: VCORE-001 Regression

on:
  push:
    branches:
      - fix/vcore-001-same-package-dependencies

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle
      - name: Run VCORE-001 regression test
        run: ./gradlew test --tests com.vericore.core.graph.DependencyGraphTest
